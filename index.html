.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;margin:0;text-wrap:balance}

.map .c b{font-size:.85rem;display:block}
.legend{display:flex;gap:10px;align-items:center;padding:0 12px 12px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-block;width:26px;height:10px;border-radius:2px;vertical-align:middle}
.scatter{padding:8px 12px 12px;overflow-x:auto}
.scatter svg{display:block;width:100%;min-width:560px;height:auto}
.scatter text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.note{color:var(--muted);font-size:.8rem;margin:6px 0}

// ---- Score composite : rang centile (0-100), hors titres suspendus.
// Référence "m" = tout le marché ; "s" = valeur et qualité classées au sein de leur groupe (financières / autres).
const GRP=d=>d.sect==="F"?"F":"X";
(function(){
  const base=DATA.filter(d=>!d.susp);
  const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
  const ranker=(pool,get,low)=>{const v=pool.map(get).filter(x=>x!=null).sort((a,b)=>a-b);
    return x=>{if(x==null||v.length<2)return null;let lo=0,hi=0;for(const y of v){if(y<x)lo++;if(y<=x)hi++}
      const r=((lo+hi-1)/2)/(v.length-1)*100;return low?100-r:r}};
  const gPER=d=>d.per>0?d.per:null,gPBR=d=>d.pbr>0?d.pbr:null,cRDT=d=>d.rdt==null?0:Math.min(d.rdt,12);
  const mk=pool=>({PER:ranker(pool,gPER,1),PBR:ranker(pool,gPBR,1),ROE:ranker(pool,d=>d.roe),MN:ranker(pool,d=>d.mn),G3:ranker(pool,d=>d.cagrRN3),G1:ranker(pool,d=>d.gRN)});
  const M=mk(base),G={F:mk(base.filter(d=>GRP(d)==="F")),X:mk(base.filter(d=>GRP(d)==="X"))};
  const rRDT=ranker(base,cRDT),r3=ranker(base,d=>d.p3m),r6=ranker(base,d=>d.p6m),r200=ranker(base,d=>d.d200);
  const pillars=(d,R)=>{
    const sV=avg([d.per>0?R.PER(d.per):(d.per==null&&d.bnpa==null?null:0),d.pbr>0?R.PBR(d.pbr):null]);
    const sQ=avg([R.ROE(d.roe),R.MN(d.mn),R.G3(d.cagrRN3)??R.G1(d.gRN)]);
    const sust=d.payout==null?(d.rdt==null?null:50):d.payout<=80?100:d.payout<=100?50:0;
    const sD=avg([rRDT(cRDT(d)),sust]),sM=avg([r3(d.p3m),r6(d.p6m),r200(d.d200)]);
    const p=[sV,sQ,sD,sM].filter(x=>x!=null);
    return {sV,sQ,sD,sM,score:p.length>=3?p.reduce((s,x)=>s+x,0)/p.length:null}};
  DATA.forEach(d=>{d.S=d.susp?{m:{},s:{}}:{m:pillars(d,M),s:pillars(d,G[GRP(d)])}});
  for(const k of ["m","s"]){DATA.filter(d=>d.S[k].score!=null).sort((a,b)=>b.S[k].score-a.S[k].score).forEach((d,i)=>d.S[k].rk=i+1)}
})();
function applyRef(ref){DATA.forEach(d=>{const x=d.S[ref]||{};d.sV=x.sV??null;d.sQ=x.sQ??null;d.sD=x.sD??null;d.sM=x.sM??null;d.score=x.score??null;d.rk=x.rk??null})}

function render(){

  v.innerHTML=refBar+`<div class="tbl"><table><thead><tr><th class="l">#</th>${cols.map(c=>`<th class="${C[c].l?"l":""}${state.sort===c?" sorted":""}" data-s="${c}" scope="col">${C[c].h}${state.sort===c?(state.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${
    rows.map((d,i)=>`<tr class="r${state.open===d.t?" open":""}" data-t="${d.t}" tabindex="0"><td class="l na">${i+1}</td>${cols.map(c=>`<td class="${C[c].l?"l":""}">${C[c].f(d)}</td>`).join("")}</tr>${state.open===d.t?`<tr><td class="detail" colspan="${cols.length+1}">${card(d)}</td></tr>`:""}`).join("")}</tbody></table></div>`;

// ---- Fiche titre : graphique 1 an avec MM 50 / MM 200
function card(d){
  const s=d.spark||[],n=s.length,dates=CAL.slice(-n);
  const ma=(w)=>s.map((_,i)=>i>=w-1?s.slice(i-w+1,i+1).reduce((a,b)=>a+b,0)/w:null);
  const m50=ma(50),m200=ma(200);
  const W=640,H=230,L=56,R=10,T=10,B=26;
  const all=s.concat(m50.filter(x=>x!=null),m200.filter(x=>x!=null));
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.06||hi*.05;lo-=pad;hi+=pad;
  const X=i=>L+i/(Math.max(1,n-1))*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const path=a=>a.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
  let g="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${nf(v,v<100?1:0)}</text>`}
  g+=`<text x="${L}" y="${H-6}">${fdate(dates[0])}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(dates[n-1])}</text>`;
  const sp=n?`<polyline points="${path(m200)}" fill="none" stroke="var(--ma2)" stroke-width="1.4"/><polyline points="${path(m50)}" fill="none" stroke="var(--ma1)" stroke-width="1.4"/><polygon points="${X(0)},${H-B} ${path(s)} ${X(n-1)},${H-B}" fill="var(--accent)" fill-opacity=".08"/><polyline points="${path(s)}" fill="none" stroke="var(--accent)" stroke-width="1.8"/><circle cx="${X(n-1)}" cy="${Y(s[n-1])}" r="3.5" fill="var(--accent)"/>`:"";
  const ev=(d.events||[]).map(e=>`Division ${e.f>=1?"1 pour "+nf(e.f,e.f%1?2:0):"(regroupement)"} le ${fdate(e.d)}, cours antérieurs ajustés.`).join(" ");
  const kv=[["Cours",nf(d.px)+" FCFA"],["Capitalisation",nf(d.cap,1)+" Mds"],["Titres",nf(d.shares)],["Flottant",d.float==null?"—":nf(d.float,1)+" %"],
    ["PER",nf(d.per,2)],["PBR",nf(d.pbr,2)],["ROE "+(d.fy||""),d.roe==null?"—":nf(d.roe,1)+" %"],["Marge nette",d.mn==null?"—":nf(d.mn,1)+" %"],
    ["Dividende net",d.div==null?"—":nf(d.div,2)+(d.divEx?` (ex. ${d.divEx})`:"")],["Rendement net",d.rdt==null?"—":nf(d.rdt,2)+" %"],
    ["Plus haut 52 sem.",nf(d.hi52)],["Plus bas 52 sem.",nf(d.lo52)],["MM 50",nf(d.sma50)],["MM 200",nf(d.sma200)],
    ["RSI 14",nf(d.rsi,1)],["Bêta",nf(d.beta,2)],["Volatilité 3 mois",d.volat==null?"—":nf(d.volat,1)+" %"],["Valeur moy. 20 j",nf(d.adv20,1)+" M"]];
  const pill=d.score==null?"":`<div class="pil"><div class="lbl">Score composite ${nf(d.score,0)} / 100 (${state.ref==="s"?"ajusté du secteur":"marché"})${d.S.m.rk?` · rang marché ${d.S.m.rk}, rang ajusté ${d.S.s.rk} sur ${DATA.filter(x=>x.S.m.rk).length}`:""}</div>${[["Valeur",d.sV],["Qualité",d.sQ],["Dividende",d.sD],["Momentum",d.sM]].map(([a,b])=>`<div class="pr"><span>${a}</span>${bar(b)}</div>`).join("")}</div>`;
  return `<div class="card"><div><h3>${d.n} <span class="tk">${d.t}</span></h3><div class="note">${SECT[d.sect]} · ${PAYS[d.pays]}${d.susp?" · cotation suspendue":""}${d.d!==PAY.asOf?` · dernier échange le ${fdate(d.d)}`:""}</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cours sur un an de ${d.n}">${g}${sp}</svg>
  <div class="leg"><span><i style="background:var(--accent)"></i>Clôture ajustée</span><span><i style="background:var(--ma1)"></i>MM 50</span><span><i style="background:var(--ma2)"></i>MM 200</span></div>${ev?`<p class="note">${ev}</p>`:""}</div>
  <div>${pill}<div class="kv">${kv.map(([a,b])=>`<div>${a}<b>${b}</b></div>`).join("")}</div></div></div>`;
}

// ---- Carte du marché (treemap squarifié)
function colorFor(v,scale){if(v==null)return"#6b7380";const t=Math.max(-1,Math.min(1,v/scale));
  if(t>=0){const a=0.25+0.75*t;return `rgb(${Math.round(60-40*a)},${Math.round(70+80*a)},${Math.round(80-20*a)})`}
  const a=0.25+0.75*-t;return `rgb(${Math.round(80+120*a)},${Math.round(60-20*a)},${Math.round(65-20*a)})`}
function squarify(items,x,y,w,h,out){
  if(!items.length||!(w>1&&h>1))return;
  const total=items.reduce((s,d)=>s+d.a,0);
  if(items.length===1){out.push({d:items[0].d,x,y,w,h});return}
  const short=Math.min(w,h),scale=(w*h)/total;let row=[],best=Infinity,i=0,rs=0;
  const worst=(r,s)=>{const mx=Math.max(...r.map(z=>z.a)),mn=Math.min(...r.map(z=>z.a));return Math.max((short*short*mx*scale)/((s*scale)**2),((s*scale)**2)/(short*short*mn*scale))};
  while(i<items.length){if(!row.length){row=[items[i]];rs=items[i].a;best=worst(row,rs);i++;continue}const r2=[...row,items[i]],s2=rs+items[i].a,wr=worst(r2,s2);if(wr<=best){row=r2;rs=s2;best=wr;i++}else break}
  const thick=rs*scale/short;let off=0;
  row.forEach(z=>{const len=z.a*scale/thick;if(w>=h)out.push({d:z.d,x:x,y:y+off,w:thick,h:len});else out.push({d:z.d,x:x+off,y:y,w:len,h:thick});off+=len});
  const rest=items.slice(i);
  if(w>=h)squarify(rest,x+thick,y,w-thick,h,out);else squarify(rest,x,y+thick,w,h-thick,out);
}
const MAPM={chg:["Variation du jour",4],p1m:["1 mois",15],ytd:["Depuis le 1er janv.",60],p1y:["1 an",80]};
function drawMap(v,rows){
  v.innerHTML=`<div class="bar" style="border-top:0"><span class="lbl">Couleur</span>${Object.entries(MAPM).map(([k,[l]])=>`<button class="chip ${state.mapM===k?"on":""}" data-m="${k}">${l}</button>`).join("")}<span class="note">Surface proportionnelle à la capitalisation. Cliquez une case pour ouvrir la fiche.</span></div><div class="map" id="map"></div><div class="legend"></div>`;
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.mapM=b.dataset.m;render()});
  const el=document.getElementById("map"),W=el.clientWidth||900,H=el.clientHeight||560,M=state.mapM,sc=MAPM[M][1];
  const out=[];squarify(rows.filter(d=>d.cap>0).map(d=>({d,a:d.cap})).sort((a,b)=>b.a-a.a),0,0,W,H,out);
  const fmt=x=>x==null?"n.d.":(x>0?"+":"")+nf(x,M==="chg"?2:1)+" %";
  el.innerHTML=out.map(o=>{const val=o.d[M];const big=o.w>54&&o.h>34;
    return `<div class="c" data-t="${o.d.t}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background:${colorFor(val,sc)}" title="${o.d.n} — ${nf(o.d.cap,1)} Mds — ${fmt(val)}">${big?`<b>${o.d.t}</b>${fmt(val)}`:(o.w>30&&o.h>14?o.d.t:"")}</div>`}).join("");
  el.onclick=e=>{const c=e.target.closest("[data-t]");if(c){state.open=c.dataset.t;state.view="ovw";render();const r=document.querySelector(`tr[data-t="${c.dataset.t}"]`);r&&r.scrollIntoView({block:"center"})}};
  const st=[-1,-.5,0,.5,1].map(x=>Math.round(x*sc));
  v.querySelector(".legend").innerHTML=st.map(s=>`<span style="background:${colorFor(s,sc)}"></span>${s>0?"+":""}${s} %`).join(" ");
}

// ---- Nuage PER × rendement
function drawScatter(v,rows){
  const pts=rows.filter(d=>d.per>0&&d.per<=60&&d.rdt!=null&&d.rdt<=15);
  const out=rows.length-pts.length,W=900,H=440,m={l:52,r:20,t:16,b:44};
  const xmax=Math.max(30,Math.ceil(Math.max(...pts.map(d=>d.per),0)/5)*5),ymax=Math.max(9,Math.ceil(Math.max(...pts.map(d=>d.rdt),0)));
  const X=p=>m.l+p/xmax*(W-m.l-m.r),Y=r=>H-m.b-r/ymax*(H-m.t-m.b),rad=c=>4+Math.sqrt(c||1)/4;
  let g="";
  for(let x=0;x<=xmax;x+=5)g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--line)"/><text x="${X(x)}" y="${H-m.b+16}" text-anchor="middle">${x}</text>`;
  for(let y=0;y<=ymax;y++)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(y)+4}" text-anchor="end">${y} %</text>`;
  const cl=DATA.filter(d=>!d.flag),mp=med(cl.map(d=>d.per)),mr=med(cl.map(d=>d.rdt));
  if(mp&&mr)g+=`<line x1="${X(mp)}" x2="${X(mp)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--accent)" stroke-dasharray="4 4"/><line x1="${m.l}" x2="${W-m.r}" y1="${Y(mr)}" y2="${Y(mr)}" stroke="var(--accent)" stroke-dasharray="4 4"/>`;
  g+=`<text x="${m.l+6}" y="${m.t+12}" style="fill:var(--up)">Bon marché et généreux</text>`;
  g+=pts.map(d=>`<g><circle cx="${X(d.per)}" cy="${Y(d.rdt)}" r="${rad(d.cap)}" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)"><title>${d.n} — PER ${nf(d.per,2)} · rendement ${nf(d.rdt,2)} % · ${nf(d.cap,1)} Mds</title></circle><text x="${X(d.per)+rad(d.cap)+3}" y="${Y(d.rdt)+4}" style="fill:var(--ink)">${d.t}</text></g>`).join("");
  g+=`<text x="${(W+m.l)/2}" y="${H-6}" text-anchor="middle">PER</text>`;
  v.innerHTML=`<div class="scatter"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PER contre rendement net">${g}</svg><p class="note">Pointillés : médianes du marché hors valeurs « à vérifier » (PER ${nf(mp,1)}, rendement ${nf(mr,2)} %). Taille du point : capitalisation.${out?` ${out} valeur(s) hors champ (PER ou rendement non disponible ou extrême).`:""}</p></div>`;
}

let tId;function toast(t){const el=document.getElementById("toast");el.textContent=t;clearTimeout(tId);tId=setTimeout(()=>el.textContent="",4000)}
async function saveFile(filename,data){
  const dl=window.claude?await window.claude.use("downloads"):null;
  if(!dl){try{const b=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Fichier enregistré.")}catch(e){toast("Le téléchargement n'est pas disponible dans cette vue.")}return}
  try{await dl.save({filename,data});toast("Fichier enregistré.")}catch(e){toast(e&&e.code==="declined"?"Téléchargement annulé.":"Téléchargement impossible ici.")}
}

  const val=(d,c)=>{const x=typeof c==="function"?c(d):d[c];return x==null?"":String(typeof x==="number"?+x.toFixed(4):x).replace(".",",")};
  const csv="﻿"+[cols.map(c=>c[0]).join(";"),...rows.map(d=>cols.map(c=>val(d,c[1])).join(";"))].join("\r\n");
  saveFile(`screener-brvm-${PAY.asOf||"export"}.csv`,csv)};
document.getElementById("exportArch").onclick=async()=>{
